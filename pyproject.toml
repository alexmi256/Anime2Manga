[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime2manga"
version = "0.1.0"
description = "Turn an anime video into a manga/storyboard markdown document."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    # The anime face detector runs through cv2.dnn, which is present in both
    # OpenCV 4 and 5.
    "opencv-python>=4.9",
    # Biharmonic panorama inpainting (skimage.restoration.inpaint_biharmonic).
    "scikit-image>=0.24",
    # Speech-bubble lettering (step 10): SVG generation and rasterisation.
    "svgwrite>=1.4",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyrefly",
]

[project.scripts]
anime2manga = "anime2manga.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anime2manga = ["data/*.onnx", "data/*.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["anime2manga"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]
